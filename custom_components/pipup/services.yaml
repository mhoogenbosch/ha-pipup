dismiss:
  target:
    entity:
      integration: pipup
      domain: binary_sensor
  fields:
    popup_id:
      selector:
        text:
    all:
      default: false
      selector:
        boolean:

sync:
  target:
    entity:
      integration: pipup
      domain: binary_sensor

fix_permission:
  target:
    entity:
      integration: pipup
  fields:
    permission:
      default: app
      selector:
        select:
          options:
            - app
            - next
            - overlay
            - install
            - admin
            - accessibility
          translation_key: permission

launch_app:
  target:
    entity:
      integration: pipup
      domain: media_player
  fields:
    package:
      example: com.netflix.ninja
      selector:
        text:
    uri:
      example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
      selector:
        text:
    wake:
      default: true
      selector:
        boolean:
    click:
      example: action-button-watch
      selector:
        text:
    wait:
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s
          mode: box
    method:
      selector:
        select:
          translation_key: method
          options:
            - click
            - tap
            - ok

send_key:
  target:
    entity:
      integration: pipup
      domain: media_player
  fields:
    key:
      required: true
      selector:
        select:
          translation_key: key
          options:
            - play_pause
            - play
            - pause
            - stop
            - next
            - previous
            - rewind
            - fast_forward
            - home
            - back

click:
  target:
    entity:
      integration: pipup
      domain: media_player
  fields:
    package:
      required: true
      example: com.plexapp.android
      selector:
        text:
    id:
      required: true
      example: action-button-watch
      selector:
        text:
    wait:
      default: 0
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s
          mode: box
    method:
      selector:
        select:
          translation_key: method
          options:
            - click
            - tap
            - ok

seek:
  target:
    entity:
      integration: pipup
      domain: media_player
  fields:
    position:
      example: 2472
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    offset:
      example: -10
      selector:
        number:
          min: -86400
          max: 86400
