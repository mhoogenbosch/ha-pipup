show:
  target:
    entity:
      integration: pipup
      domain: binary_sensor
  fields:
    title:
      selector:
        text:
    message:
      selector:
        text:
          multiline: true
    duration:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    popup_id:
      selector:
        text:
    position:
      selector:
        select:
          options:
            - top_right
            - top_left
            - bottom_right
            - bottom_left
            - center
          translation_key: position
    muted:
      selector:
        boolean:
    padding:
      selector:
        number:
          min: 0
          max: 256
          unit_of_measurement: px
          mode: box
    button_size:
      selector:
        number:
          min: 4
          max: 96
          unit_of_measurement: sp
          mode: box
    animation:
      selector:
        select:
          options:
            - none
            - fade
            - slide_left
            - slide_right
            - slide_top
            - slide_bottom
          translation_key: animation
    sound:
      example: "default"
      selector:
        text:
    sound_volume:
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider
    dismiss_screensaver:
      selector:
        boolean:
    tts:
      selector:
        text:
    tts_language:
      example: nl-NL
      selector:
        text:
    urgency:
      selector:
        select:
          options:
            - info
            - warning
            - critical
          translation_key: urgency
    border_color:
      example: "#00E5FF"
      selector:
        text:
    border_width:
      selector:
        number:
          min: 0
          max: 64
          unit_of_measurement: px
          mode: box
    corner_radius:
      selector:
        number:
          min: 0
          max: 128
          unit_of_measurement: px
          mode: box
    poster_url:
      example: "http://192.168.1.10:5000/api/doorbell/latest.jpg"
      selector:
        text:
    icon:
      example: "http://homeassistant.local:8123/local/icons/deurbel.png"
      selector:
        text:
    icon_position:
      selector:
        select:
          options:
            - left
            - right
    icon_width:
      selector:
        number:
          min: 1
          max: 1024
          unit_of_measurement: px
          mode: box
    show_progress:
      selector:
        boolean:
    buttons:
      example: "[{id: unlock, label: Voordeur openen}]"
      selector:
        object:
    camera_entity:
      selector:
        entity:
          domain: camera
    camera_mode:
      default: mjpeg
      selector:
        select:
          options:
            - mjpeg
            - stream
            - snapshot
          translation_key: camera_mode
    image_url:
      selector:
        text:
    video_url:
      selector:
        text:
    web_url:
      selector:
        text:
    media_width:
      selector:
        number:
          min: 1
          max: 3840
          mode: box
    media_height:
      selector:
        number:
          min: 1
          max: 2160
          mode: box
    title_color:
      example: "#0066cc"
      selector:
        text:
    title_size:
      selector:
        number:
          min: 6
          max: 96
          mode: box
    message_color:
      example: "#ffffff"
      selector:
        text:
    message_size:
      selector:
        number:
          min: 6
          max: 96
          mode: box
    background_color:
      example: "#CC000000"
      selector:
        text:

dismiss:
  target:
    entity:
      integration: pipup
      domain: binary_sensor
  fields:
    popup_id:
      selector:
        text:

fix_permission:
  target:
    entity:
      integration: pipup
  fields:
    permission:
      default: app
      selector:
        select:
          options:
            - app
            - next
            - overlay
            - install
            - admin
            - accessibility
          translation_key: permission
